[project]
name = "liquidity-collapse"
version = "0.1.0"
description = "Liquidity-collapse signal for a long-only fund"
requires-python = ">=3.11,<3.14"
dependencies = ["sf-quant", "polars", "numpy"]

[project.scripts]
lab = "liquidity_collapse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liquidity_collapse"]

[tool.uv.sources]
sf-quant = { path = "../../libraries/sf-quant-07", editable = false }
