<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquidity Collapse: Question Drill</title>
<style>
  :root { --ink:#1b1b1b; --muted:#5a5a5a; --line:#d9d9d9; --navy:#1b3a6b; --blue:#2a78d6; --good:#1e8a4c; --bad:#c4501f; --bg:#f7f7f5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:16px 24px; border-bottom:4px solid var(--blue); }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; opacity:.85; font-size:14px; }
  main { max-width:820px; margin:0 auto; padding:20px 24px 60px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); margin-bottom:12px; }
  .filters label { cursor:pointer; white-space:nowrap; }
  .banner { background:#fff6e5; border:1px solid #f0d49a; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:14px; }
  .progress { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress div { height:100%; background:var(--blue); width:0; transition:width .2s; }
  .status { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; margin:6px 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px 26px; }
  .tag { display:inline-block; font-size:12px; color:#fff; background:var(--blue); border-radius:10px; padding:2px 10px; margin-bottom:10px; }
  .q { font-size:20px; font-weight:600; line-height:1.35; margin-bottom:16px; }
  .choice { display:block; width:100%; text-align:left; font:inherit; font-size:16px; line-height:1.4; padding:12px 14px; margin-bottom:8px;
            border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
  .choice:hover:not(:disabled) { border-color:var(--blue); background:#f3f8fe; }
  .choice .key { display:inline-block; width:22px; color:var(--muted); font-weight:600; }
  .choice.right { border-color:var(--good); background:#e8f5ee; }
  .choice.wrong { border-color:var(--bad); background:#fbece6; }
  .choice:disabled { cursor:default; }
  .why { margin-top:10px; padding:12px 14px; border-radius:8px; background:#f4f4f2; font-size:15px; line-height:1.5; }
  .why b.ok { color:var(--good); } .why b.no { color:var(--bad); }
  button.btn { font:inherit; font-size:15px; padding:9px 18px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-top:14px; margin-right:8px; }
  button.btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  .end h2 { margin:0 0 6px; }
  .missed { margin-top:14px; }
  .missed div { border-left:3px solid var(--bad); padding:6px 12px; margin-bottom:8px; background:#fff; font-size:14px; }
  .missed div span { display:block; color:var(--good); margin-top:3px; }
  .hidden { display:none; }
  kbd { font-family:inherit; font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:#fafafa; }
</style>
</head>
<body>
<header>
  <h1>Liquidity Collapse: Question Drill</h1>
  <p>20 multiple-choice questions on our idea, Sharpe and information ratios, active positions, mean–variance optimization and our results. Missed questions come back until you get them right.</p>
</header>
<main>
  <div class="filters" id="filters"></div>
  <div class="banner hidden" id="banner"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="status"><span id="where"></span><span id="score"></span></div>

  <div class="card" id="quiz">
    <span class="tag" id="tag"></span>
    <div class="q" id="question"></div>
    <div id="choices"></div>
    <div class="why hidden" id="why"></div>
    <button class="btn primary hidden" id="next" onclick="next()">Next <kbd>Enter</kbd></button>
  </div>

  <div class="card end hidden" id="end">
    <h2 id="endTitle"></h2>
    <div id="endText"></div>
    <div class="missed" id="missedList"></div>
    <button class="btn primary hidden" id="drillMisses" onclick="startRound(lastMisses)"></button>
    <button class="btn" onclick="startOver()">Start over with all questions</button>
  </div>
</main>

<script>
// Each question: [topic, question, correct answer, [three wrong answers], explanation]
const QS = [
["Our idea", "What counts as a liquidity collapse in our study?",
 "A stock's trading falls far below its own normal level over the past year",
 ["A stock is in the least liquid fifth of the market", "A stock's price falls more than 10% in a week", "A stock is removed from the benchmark"],
 "We compare each stock with its own past year: how much its price moves for each dollar traded. A stock is flagged when it becomes one of the worst 5% after at least a month of normal trading."],
["Our idea", "Why do we expect a liquidity collapse to be followed by lower returns?",
 "The stock must pass from investors who avoid illiquid stocks to a small group of patient buyers, and that slow hand-off pushes the price down",
 ["Illiquid stocks are riskier, so investors demand a higher return", "Companies whose stock stops trading are usually about to fail", "Wider bid–ask spreads mechanically lower measured returns"],
 "Most investors avoid illiquid stocks. After a collapse the stock has to move to the few patient holders, who will only buy at a lower price, and that takes months."],
["Our idea", "Why is the story about a change in liquidity rather than its level?",
 "A stock that was always illiquid is already held by patient investors, so there is nothing to hand off",
 ["Illiquid stocks always underperform, so the level is already priced in", "The level of liquidity is too hard to measure", "Changes in liquidity are larger than levels"],
 "That's why we compare each flagged stock with similar stocks that were just as illiquid before the event."],
["Our idea", "If the decline is predictable, why isn't it traded away?",
 "Shorting small, illiquid stocks is expensive and often impossible",
 ["The effect is too small for anyone to bother", "Regulators forbid trading on liquidity data", "The decline only exists in Barra's data"],
 "Anyone who saw it coming would want to short the stock, but these shares are hard to borrow and costly to trade."],
["Our idea", "Which finding directly supports the hand-off story?",
 "At the same size, stocks that are already illiquid earn slightly more",
 ["Large stocks show the strongest drift", "The drift comes from large price moves rather than falling volume", "Flagged stocks bounce back within a week"],
 "That small extra return is the patient holders' reward for holding illiquid stocks. The drift we trade happens during the move to those holders."],
["Our idea", "Why do we remove what the fund's six existing scores already capture before building the signal?",
 "So the signal only gets credit for information the fund doesn't already trade",
 ["To make the signal less volatile", "Because the scores are measured with error", "To lower trading costs"],
 "Once that overlap is removed, the signal's forecasting power roughly triples: the part the fund's scores miss is the useful part."],

["Sharpe ratio", "What does the Sharpe ratio measure?",
 "How much return above the risk-free rate a portfolio earns for each unit of total risk",
 ["How much a portfolio beats its benchmark for each unit of risk taken against the benchmark", "How much of a portfolio's return comes from the market", "How far a portfolio has fallen from its peak"],
 "The first wrong answer describes the information ratio: the same idea, measured against a benchmark instead of against cash."],
["Sharpe ratio", "You borrow at the risk-free rate to double your position in a portfolio. Its Sharpe ratio…",
 "Stays the same",
 ["Doubles", "Halves", "Rises, but by less than double"],
 "Both the extra return and the risk double, so return per unit of risk is unchanged. Borrowing changes how much risk you take, not how good the trade is."],

["Alpha and beta", "What does it mean for a stock to have positive alpha relative to your portfolio?",
 "It earns more than its exposure to your portfolio would justify, so adding a bit more of it improves your risk-adjusted return",
 ["It moves more than the market", "It has gone up more than your portfolio this year", "It is less risky than your portfolio"],
 "Alpha is the part of expected return not explained by the stock's exposure to the portfolio. Positive alpha is the reason to tilt toward a stock."],
["Alpha and beta", "Why do funds usually keep their beta to the benchmark at 1?",
 "So the active return comes from picking stocks, not from betting on the market going up or down",
 ["Because a beta of 1 has the highest expected return", "Because regulators require it", "To keep trading costs low"],
 "Investors choose their own market exposure. Our optimizer keeps the active positions at zero beta for the same reason."],

["Active positions and IR", "What are a fund's active positions?",
 "How much more or less of each stock the fund holds than the benchmark: its overweights and underweights, which net to zero",
 ["The stocks the fund bought or sold this month", "The fund's total holdings in each stock", "The fund's cash and borrowing"],
 "Active positions are the fund's bets against the benchmark. Every overweight is paid for by underweights elsewhere."],
["Active positions and IR", "The information ratio is…",
 "Expected active return ÷ active risk",
 ["Expected excess return ÷ total volatility", "Active return ÷ beta", "Alpha ÷ IC"],
 "The Sharpe ratio of the active positions: reward per unit of risk taken relative to the benchmark."],
["Active positions and IR", "You double every active position. The information ratio…",
 "Is unchanged",
 ["Doubles", "Halves", "Falls, because risk grows faster than return"],
 "Active return and active risk both double. How big to make the bets is a separate choice, set by how much risk you want to take."],
["Active positions and IR", "A long-only fund wants to bet against a stock. How far can it go?",
 "It can sell the stock down to zero: at most the stock's whole weight in the benchmark",
 ["As far as its risk budget allows", "Up to 5% of the portfolio", "Not at all; long-only funds can't bet against stocks"],
 "Small stocks have tiny benchmark weights, so there is little room to bet against them. That is what limits our signal."],

["Fundamental law and alpha", "According to the fundamental law of active management, how can a manager raise the information ratio?",
 "Forecast more accurately, or make more independent bets",
 ["Take more risk", "Trade less often", "Hold fewer stocks with more conviction"],
 "Skill and breadth both count: modest skill applied across many stocks can match great skill on a few."],
["Fundamental law and alpha", "Why should the same signal mean a bigger expected return for a more volatile stock?",
 "A volatile stock's price moves more, so the same predictive skill is worth more there",
 ["Volatile stocks always have higher expected returns", "To penalize risky stocks", "Because volatile stocks are cheaper to trade"],
 "This is the Grinold–Kahn rule for turning a signal into an alpha. Our first version ignored it and overrated calm stocks, which delivered about a third of what was predicted."],
["Fundamental law and alpha", "Our long-only portfolio's transfer coefficient is 0.36 in 2019–2024. That means…",
 "It keeps about 36% of the risk-adjusted return the same forecasts would earn without the long-only rule",
 ["36% of the stocks are held long", "36% of its return comes from the signal", "The signal's forecasts are right 36% of the time"],
 "The transfer coefficient measures how much of a signal's value survives the fund's constraints. Ours is limited because the stocks we want to bet against hold little benchmark weight."],

["Our design and results", "Why do we rebalance daily rather than monthly?",
 "Most of the drift comes in the first weeks; trading monthly reaches most events too late",
 ["Daily trading lowers costs", "The risk model only updates daily", "Monthly data was not available"],
 "In 2019–2024, daily long-only earned about +0.5% a year; monthly earned nothing."],
["Our design and results", "What makes 2019–2024 an honest test?",
 "The design was frozen first, and those years were run only once",
 ["It's a longer period than 2011–2018", "Markets were calmer then", "The forecasts were fitted on 2019–2024 data"],
 "Each January the forecasts are re-estimated from earlier years only, and none of the design choices used 2019–2024."],
["Our design and results", "Why does simply dropping flagged stocks from the benchmark barely earn anything?",
 "Dropping them tilts the portfolio toward large stocks, and that noise swamps the effect",
 ["Flagged stocks aren't in the benchmark", "Funds are not allowed to drop stocks", "The effect disappears without daily trading"],
 "The optimizer hedges that tilt and sizes each bet to its expected return and risk, which is what makes the signal pay."],
];

const KEY = "liquidity-collapse-missed";
const topics = [...new Set(QS.map(q => q[0]))];
const filters = document.getElementById("filters");
filters.innerHTML = "Topics: " + topics.map(t => `<label><input type="checkbox" value="${t}" checked onchange="startTopics()"> ${t}</label>`).join("");
const chosenTopics = () => [...filters.querySelectorAll("input:checked")].map(i => i.value);

let round = [], pos = 0, right = 0, misses = [], lastMisses = [], answered = false, roundNo = 0;
const saved = () => JSON.parse(localStorage.getItem(KEY) || "[]");
const save = s => localStorage.setItem(KEY, JSON.stringify([...new Set(s)]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function startOver() {
  save([]);
  const t = chosenTopics();
  startRound(QS.map((_, i) => i).filter(i => t.includes(QS[i][0])));
}

function startTopics() {
  const t = chosenTopics();
  startRound(QS.map((_, i) => i).filter(i => t.includes(QS[i][0])));
}

function startRound(indices) {
  round = shuffle([...indices]); pos = 0; right = 0; misses = []; roundNo++;
  document.getElementById("banner").classList.add("hidden");
  document.getElementById("end").classList.add("hidden");
  if (!round.length) { finish(); return; }
  document.getElementById("quiz").classList.remove("hidden");
  show();
}

function show() {
  answered = false;
  const [topic, q, correct, wrong] = QS[round[pos]];
  document.getElementById("tag").textContent = topic;
  document.getElementById("question").textContent = q;
  const opts = shuffle([correct, ...wrong]);
  document.getElementById("choices").innerHTML = opts.map((o, k) =>
    `<button class="choice" data-right="${o === correct}" onclick="answer(this)"><span class="key">${k + 1}</span>${esc(o)}</button>`).join("");
  document.getElementById("why").classList.add("hidden");
  document.getElementById("next").classList.add("hidden");
  status();
}

function answer(btn) {
  if (answered) return;
  answered = true;
  const id = round[pos], ok = btn.dataset.right === "true";
  document.querySelectorAll(".choice").forEach(b => { b.disabled = true; if (b.dataset.right === "true") b.classList.add("right"); });
  const missed = saved().filter(i => i !== id);
  if (ok) { right++; save(missed); }
  else { btn.classList.add("wrong"); misses.push(id); save([...missed, id]); }
  const why = document.getElementById("why");
  why.innerHTML = `<b class="${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite."}</b> ${esc(QS[id][4])}`;
  why.classList.remove("hidden");
  document.getElementById("next").classList.remove("hidden");
  status();
}

function next() {
  if (!answered) return;
  pos++;
  if (pos < round.length) show(); else finish();
}

function finish() {
  document.getElementById("quiz").classList.add("hidden");
  const end = document.getElementById("end");
  end.classList.remove("hidden");
  lastMisses = [...misses];
  const n = round.length;
  document.getElementById("endTitle").textContent = !n ? "No questions in the chosen topics."
    : misses.length ? `${right} of ${n} right` : `All ${n} right.`;
  document.getElementById("endText").textContent = !n ? "" : misses.length
    ? "Here's what you missed. Drill these until they stick." : "Nothing missed this round.";
  document.getElementById("missedList").innerHTML = misses.map(i =>
    `<div>${esc(QS[i][1])}<span>${esc(QS[i][2])}</span></div>`).join("");
  const b = document.getElementById("drillMisses");
  b.textContent = `Drill my misses (${misses.length})`;
  b.classList.toggle("hidden", !misses.length);
  document.getElementById("bar").style.width = "100%";
}

function status() {
  const n = round.length, done = pos + (answered ? 1 : 0);
  document.getElementById("bar").style.width = n ? `${100 * done / n}%` : "0";
  document.getElementById("where").textContent = `Round ${roundNo} · question ${Math.min(pos + 1, n)} of ${n}`;
  document.getElementById("score").textContent = `${right} right so far`;
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = parseInt(e.key, 10);
  if (k >= 1 && k <= 4) { const b = document.querySelectorAll(".choice")[k - 1]; if (b) answer(b); }
  else if (e.key === "Enter") next();
});

// On opening: pick up questions missed last time, if any.
const carry = saved().filter(i => i < QS.length);
if (carry.length) {
  const banner = document.getElementById("banner");
  banner.innerHTML = `You missed ${carry.length} question${carry.length > 1 ? "s" : ""} last time. ` +
    `<button class="btn primary" style="margin:0 6px" onclick="startRound(saved())">Drill them</button>` +
    `<button class="btn" style="margin:0" onclick="startOver()">Start over</button>`;
  startTopics();
  banner.classList.remove("hidden");
} else {
  startOver();
}
</script>
</body>
</html>
